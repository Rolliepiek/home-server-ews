name: Rust

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --manifest-path ./home-server-ews/Cargo.toml
    - name: Run tests
      run: cargo test --verbose --manifest-path ./home-server-ews/Cargo.toml
